    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 50
        model:
          completion_params: {}
          mode: chat
          name: deepseek-reasoner
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: 46be0def-f4f9-45b4-8b61-8f7f7563881e
          role: system
          text: "你是一位顶级的 AI 学术科学家。请仔细阅读以下抓取到的论文全文内容：\n<full_text>\n{{#1777128852253.body#}}\n\
            </full_text>\n\n结合用户的提问：{{#sys.query#}}\n\n请为用户撰写一份详尽的“全文深度解析报告”。请使用严谨的学术口吻，并严格按照以下\
            \ Markdown 格式输出：\n\n论文核心档案\n- 标题：[提取标题]\n- 核心问题：[这篇论文试图解决什么痛点？]\n\n方法论深度解析\n\
            [详细解读论文提出的核心算法、模型架构或创新机制，说明它是如何运作的]\n\n实验与数据\n[提炼论文中最重要的实验设置、使用的数据集以及取得的最亮眼性能指标]\n\
            \n 局限性与未来方向\n\n[基于全文内容，指出该研究目前的不足，以及作者提到的未来研究方向]\n核心准则】\n你将收到由爬虫抓取的网页内容。\n\
            拒绝幻觉：如果抓取的内容包含“403 Forbidden”、“Access Denied”、“Enable Cookies”、“Cloudflare”或明显的错误提示，你必须停止解析，并直接回答：“抱歉，由于该期刊网站设有反爬虫防火墙，我无法直接读取全文内容。但我可以基于摘要为您提供核心分析。”\n\
            核实内容：只有当你确认收到的文本确实包含论文的正文（如 Introduction, Methods, Results 等章节）时，才开始撰写深度报告。\n\
