    - data:
        code: "import json\nimport re\nimport xml.etree.ElementTree as ET\n\ndef normalize_title(title):\n\
          \    \"\"\"标题标准化，用于跨库去重\"\"\"\n    if not title: return \"\"\n    return\
          \ re.sub(r'[^a-z0-9]', '', title.lower())\n\ndef get_id_priority(pid):\n\
          \    \"\"\"定义 ID 质量等级，解决 404 报错\"\"\"\n    pid = str(pid or \"\")\n    if\
          \ len(pid) == 40 and re.match(r'^[a-fA-F0-9]+$', pid): return 3\n    if\
          \ pid.startswith(\"10.\"): return 2\n    if pid.startswith(\"W\") and pid[1:].isdigit():\
          \ return 1\n    return 0\n\ndef main(s2_res: str, oa_res: str, arxiv_res:\
          \ str, dblp_res: str) -> dict:\n    if not any([s2_res.strip(), oa_res.strip(),\
          \ arxiv_res.strip(), dblp_res.strip()]):\n        return {\"merged_papers_json\"\
          : \"F\", \"saved_papers_compact\": \"[]\", \"graph_data_json\": \"[]\"}\n\
          \        \n    merged_papers = {}\n\n    def add_or_update_paper(norm_t,\
          \ paper_info):\n        if norm_t not in merged_papers:\n            paper_info['venues_set']\
          \ = {paper_info.get('venue')} if paper_info.get('venue') else set()\n  \
          \          paper_info['local_in_degree'] = 0 \n            paper_info['ref_norm_titles']\
          \ = paper_info.get('ref_norm_titles') or []\n            if 'citationCount'\
          \ not in paper_info: paper_info['citationCount'] = 0\n            merged_papers[norm_t]\
          \ = paper_info\n        else:\n            existing = merged_papers[norm_t]\n\
          \            new_id = paper_info.get('paperId', '')\n            old_id\
          \ = existing.get('paperId', '')\n            if get_id_priority(new_id)\
          \ > get_id_priority(old_id):\n                existing['paperId'] = new_id\n\
          \            new_venue = paper_info.get('venue', '').strip()\n         \
          \   if new_venue:\n                if paper_info.get('source') == 'DBLP':\n\
          \                    existing['venues_set'].add(f\"DBLP: {new_venue}\")\
          \ \n                elif 'arxiv' not in new_venue.lower() and 'preprint'\
          \ not in new_venue.lower():\n                    existing['venues_set'].add(new_venue)\n\
          \            if existing.get('abstract') in [\"暂缺\", \"\", \"见原文链接\"] and\
          \ paper_info.get('abstract'):\n                existing['abstract'] = paper_info['abstract']\n\
          \            if paper_info.get('citationCount', 0) > existing.get('citationCount',\
          \ 0):\n                existing['citationCount'] = paper_info['citationCount']\n\
