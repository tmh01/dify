    - data:
        code: "import json\nimport re\nfrom collections import Counter\n\ndef main(raw_citations:\
          \ str) -> dict:\n    # 终极兜底：确保即便出错，下游节点也能拿到合法的变量名\n    fallback = {\n  \
          \      \"merged_papers_json\": \"[]\",\n        \"trend_summary\": \"抱歉，由于引文数据库尚未收录该论文或\
          \ ID 匹配失败，无法生成演进趋势报告。\",\n        \"corpus_sample\": \"暂无引文样本数据。\"\n   \
          \ }\n    \n    try:\n        # 1. 强力防御：拦截所有非 JSON 的错误信息（如 404 字符串）\n   \
          \     if not raw_citations or not isinstance(raw_citations, str):\n    \
          \        return fallback\n        \n        clean_input = raw_citations.strip()\n\
          \        if \"error\" in clean_input.lower() or \"404\" in clean_input or\
          \ clean_input.startswith(\"Failed\"):\n            return fallback\n   \
          \         \n        data = json.loads(clean_input)\n        papers_list\
          \ = data.get(\"data\", [])\n        if not papers_list:\n            return\
          \ fallback\n            \n        formatted_papers = []\n        years_list\
          \ = []\n        authors_list = []\n        full_text_for_keywords = \"\"\
          \ \n        structured_samples = []\n\n        for item in papers_list:\n\
          \            # Semantic Scholar 的引文结构是 citingPaper\n            paper =\
          \ item.get(\"citingPaper\", {})\n            if not paper: continue\n  \
          \          \n            title = paper.get(\"title\", \"\")\n          \
          \  if not title: continue\n            \n            # A. 时间线统计\n      \
          \      year = paper.get(\"year\")\n            if year: years_list.append(int(year))\n\
          \                \n            # B. 活跃学者统计\n            names = [a.get(\"\
          name\", \"\") for a in paper.get(\"authors\", []) if isinstance(a, dict)\
          \ and a.get(\"name\")]\n            authors_list.extend(names)\n       \
          \     \n            # C. 为 LLM 12 生成结构化采样片段\n            abstract_snippet\
          \ = paper.get('abstract', '') or \"摘要暂缺\"\n            sample_text = f\"\
          【年份：{year or '未知'}】 标题：{title} | 摘要摘要：{abstract_snippet[:200]}...\"\n  \
          \          structured_samples.append(sample_text)\n            \n      \
          \      # D. 聚合语料用于关键词提取\n            full_text_for_keywords += f\" {title}\
          \ {abstract_snippet}\"\n            \n            formatted_papers.append({\n\
          \                \"title\": title,\n                \"year\": str(year or\
          \ \"未知\"),\n                \"authors\": \", \".join(names),\n         \
          \       \"url\": paper.get(\"url\", \"\"),\n                \"venue\": paper.get(\"\
          venue\", \"未知\"),\n                \"citationCount\": paper.get(\"citationCount\"\
          , 0)\n            })\n\n        # ---------------------------------------------------------\n\
          \        # 2. 深度特征提取逻辑\n        # ---------------------------------------------------------\n\
          \        # A. 计算年份分布（用于演进热度分析）\n        year_counts = dict(Counter(years_list))\n\
          \        sorted_year_str = \", \".join([f\"{y}年({c}篇)\" for y, c in sorted(year_counts.items())])\n\
          \        \n        # B. 关键词降噪提取（过滤掉学术公文常用词）\n        words = re.findall(r'\\\
          b[A-Za-z]{4,}\\b', full_text_for_keywords.lower())\n        academic_stopwords\
          \ = {\n            \"this\", \"that\", \"with\", \"from\", \"these\", \"\
          model\", \"method\", \"paper\", \n            \"approach\", \"based\", \"\
          using\", \"proposed\", \"performance\", \"results\",\n            \"study\"\
          , \"analysis\", \"system\", \"research\", \"data\", \"application\"\n  \
          \      }\n        # 如果用户搜的是 Mamba 相关的，建议这里也动态过滤搜索词，但这版先做通用优化\n        top_words\
          \ = [w for w, c in Counter([w for w in words if w not in academic_stopwords]).most_common(15)]\n\
          \        \n        # C. 统计高频学者（保留前 8 名）\n        top_scholars = [a for a,\
          \ c in Counter(authors_list).most_common(8)]\n        \n        # 3. 组装给\
          \ LLM 12 的宏观摘要\n        trend_summary = (\n            f\"【文献演进特征摘要】\\n\"\
          \n            f\"- 累计被引样本数：{len(formatted_papers)} 篇\\n\"\n            f\"\
          - 年份分布趋势：{sorted_year_str}\\n\"\n            f\"- 核心流派关键词：{', '.join(top_words)}\\\
          n\"\n            f\"- 活跃跟进团队/学者：{', '.join(top_scholars)}\"\n        )\n\
          \n        # 4. 最终返回：截断输出以保护 Token 和变量限制\n        return {\n            \"\
          merged_papers_json\": json.dumps(formatted_papers[:15], ensure_ascii=False),\n\
          \            \"trend_summary\": trend_summary,\n            \"corpus_sample\"\
          : \"\\n\\n\".join(structured_samples[:10]) # 采样前 10 篇最具代表性的\n        }\n\
          \        \n    except Exception:\n        # 发生任何未预料的解析异常时，绝不抛红，走 fallback\n\
          \        return fallback"
