    - data:
        code: "def main(http_body: str, original_url: str) -> dict:\n    import json\n\
          \    \n    # 【核心修复 1】：如果最初传来的是纯 ID，强行给它拼装成一个真实的兜底网址\n    fallback_url =\
          \ original_url.strip()\n    if not fallback_url.startswith(\"http\"):\n\
          \        if fallback_url.startswith(\"W\"):\n            fallback_url =\
          \ f\"https://openalex.org/{fallback_url}\"\n        elif \".\" in fallback_url\
          \ and len(fallback_url) < 15:\n            fallback_url = f\"https://arxiv.org/abs/{fallback_url}\"\
          \n        else:\n            fallback_url = f\"https://www.semanticscholar.org/paper/{fallback_url}\"\
          \n            \n    final_url = fallback_url\n    status = \"use_fallback\"\
          \n    \n    try:\n        data = json.loads(http_body)\n        \n     \
          \   # 【核心修复 2】：如果 API 查到了官方网址，优先使用\n        if \"url\" in data and data[\"\
          url\"]:\n            final_url = data[\"url\"]\n            status = \"\
          use_official_url\"\n        \n        # 【核心修复 3】：如果 API 查到了免费的开源 PDF，最高优先级使用！\n\
          \        if \"openAccessPdf\" in data and data[\"openAccessPdf\"] and data[\"\
          openAccessPdf\"].get(\"url\"):\n            oa_url = data[\"openAccessPdf\"\
          ][\"url\"].strip()\n            if oa_url: \n                if \"arxiv.org\"\
          \ in oa_url:\n                    if \"/pdf/\" in oa_url:\n            \
          \            oa_url = oa_url.replace(\"/pdf/\", \"/abs/\")\n           \
          \         if oa_url.endswith(\".pdf\"):\n                        oa_url\
          \ = oa_url[:-4]\n                    final_url = oa_url.replace(\"arxiv.org\"\
          , \"ar5iv.org\")\n                    status = \"converted_to_ar5iv\"\n\
          \                else:\n                    final_url = oa_url\n       \
          \             status = \"use_other_open_access\"\n                    \n\
          \    except Exception as e:\n        pass # 解析报错就乖乖用 fallback_url\n    \
          \    \n    # 如果最终选定的网址是 ArXiv，统一转换成 ar5iv 以获取最佳的全文抓取效果\n    if status in\
          \ [\"use_fallback\", \"use_official_url\"] and \"arxiv.org\" in final_url:\n\
          \        final_url = final_url.replace(\"arxiv.org\", \"ar5iv.org\").replace(\"\
          /pdf/\", \"/abs/\")\n        \n    return {\n        \"final_url\": final_url,\n\
          \        \"convert_status\": status\n    }"
