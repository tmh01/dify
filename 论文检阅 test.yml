    - data:
        code: "import re\nimport urllib.parse\n\ndef main(core_query: str, author:\
          \ str, venue: str, year_start: int, year_end: int, limit: int) -> dict:\n\
          \    core_query = core_query or \"\"\n    author = author or \"\"\n    venue\
          \ = venue or \"\"\n    base_limit = limit or 5\n\n    # ==========================================\n\
          \    # 融合“限制动态化”逻辑：放大检索基数\n    # ==========================================\n\
          \    search_limit = base_limit * 5\n    rank_1_limit = base_limit * 5\n\
          \    llm_rank = 0\n\n    # ==========================================\n\
          \    # 核心优化：智能分流处理与清洗\n    # ==========================================\n\
          \    q_no_quotes = core_query.replace('\"', '').strip()\n    clean_keywords\
          \ = re.sub(r'\\s+(?i:AND|OR)\\s+', ' ', q_no_quotes)\n    clean_keywords\
          \ = re.sub(r'\\s+', ' ', clean_keywords).strip()\n    tokens = [t.strip()\
          \ for t in re.split(r'\\s+(?i:AND|OR)\\s+', q_no_quotes) if t.strip()]\n\
          \n    # ---------------------------------------------------------\n    #\
          \ 1. 组装 Semantic Scholar URL\n    # ---------------------------------------------------------\n\
          \    s2_query_parts = []\n    if clean_keywords: s2_query_parts.append(clean_keywords)\n\
          \    if author: s2_query_parts.append(author)\n    if venue: s2_query_parts.append(venue)\n\
          \    s2_query = \" \".join(s2_query_parts).strip()\n    \n    safe_query\
          \ = urllib.parse.quote(s2_query)\n    s2_url = f\"https://api.semanticscholar.org/graph/v1/paper/search?query={safe_query}&limit={search_limit}&fields=paperId,title,abstract,url,year,authors,venue,journal,citationCount,influentialCitationCount,references.title\"\
          \n    \n    if year_start and year_end:\n        s2_url += f\"&year={year_start}-{year_end}\"\
          \ if year_start != year_end else f\"&year={year_start}\"\n    elif year_start:\n\
          \        s2_url += f\"&year={year_start}-\"\n    elif year_end:\n      \
          \  s2_url += f\"&year=-{year_end}\"\n\n    # ---------------------------------------------------------\n\
          \    # 2. 组装 OpenAlex URL\n    # ---------------------------------------------------------\n\
          \    oa_search_parts = [clean_keywords]\n    if venue: oa_search_parts.append(venue)\n\
          \    oa_search = \" \".join(oa_search_parts).strip()\n    \n    oa_filters\
          \ = []\n    if author: oa_filters.append(f\"raw_author_name.search:{author}\"\
          )\n    if year_start and year_end:\n        if year_start == year_end: oa_filters.append(f\"\
          publication_year:{year_start}\")\n        else: oa_filters.append(f\"publication_year:{year_start}-{year_end}\"\
          )\n    elif year_start: oa_filters.append(f\"publication_year:>{int(year_start)-1}\"\
          )\n    elif year_end: oa_filters.append(f\"publication_year:<{int(year_end)+1}\"\
          )\n         \n    oa_filter_str = \",\".join(oa_filters)\n    \n    oa_url\
          \ = f\"https://api.openalex.org/works?search={urllib.parse.quote(oa_search)}&per_page={search_limit}\"\
          \n    if oa_filter_str:\n        oa_url += f\"&filter={urllib.parse.quote(oa_filter_str)}\"\
          \n\n    # ---------------------------------------------------------\n  \
          \  # 3. 组装 arXiv URL\n    # ---------------------------------------------------------\n\
          \    arxiv_query_parts = []\n    if tokens:\n        arxiv_phrases = [f'all:\"\
          {token}\"' for token in tokens]\n        arxiv_search_query = \" AND \"\
          .join(arxiv_phrases)\n    else:\n        arxiv_search_query = \"\"\n   \
          \ \n    if author:\n        if arxiv_search_query: arxiv_search_query +=\
          \ f' AND au:\"{author}\"'\n        else: arxiv_search_query = f'au:\"{author}\"\
          '\n    if venue:\n        if arxiv_search_query: arxiv_search_query += f'\
          \ AND jr:\"{venue}\"'\n        else: arxiv_search_query = f'jr:\"{venue}\"\
          '\n        \n    if not arxiv_search_query: arxiv_search_query = 'all:\"\
          machine learning\"'\n\n    arxiv_url = f\"http://export.arxiv.org/api/query?search_query={urllib.parse.quote(arxiv_search_query)}&start=0&max_results={search_limit}&sortBy=relevance&sortOrder=descending\"\
          \n\n    # ---------------------------------------------------------\n  \
          \  # 4. 组装 DBLP URL\n    # ---------------------------------------------------------\n\
          \    dblp_parts = []\n    if clean_keywords: dblp_parts.extend(clean_keywords.split())\n\
          \    if author: dblp_parts.extend(author.split())\n    \n    seen = set()\n\
          \    dblp_unique = [w for w in dblp_parts if w.lower() not in seen and not\
          \ seen.add(w.lower())]\n    dblp_query = \" \".join(dblp_unique).strip()\n\
          \n    dblp_url = f\"https://dblp.org/search/publ/api?q={urllib.parse.quote(dblp_query)}&format=json&h={search_limit}\"\
          \n\n    return {\n        \"s2_url\": s2_url,\n        \"oa_url\": oa_url,\n\
          \        \"arxiv_url\": arxiv_url,\n        \"dblp_url\": dblp_url,\n  \
          \      \"Search_limit\": search_limit,\n        \"Rank_1_limit\": rank_1_limit,\n\
          \        \"LLM_Rank\": llm_rank\n    }"
