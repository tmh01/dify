    - data:
        code: "import json\nimport re\nimport xml.etree.ElementTree as ET\n\ndef normalize_title(title):\n\
          \    if not title: return \"\"\n    return re.sub(r'[^a-z0-9]', '', title.lower())\n\
          \ndef main(s2_res: str, oa_res: str, arxiv_res: str, dblp_res: str, Rank_1_limit:\
          \ int) -> dict:\n    if s2_res==oa_res==arxiv_res==\" \":\n        return\
          \ {\"merged_papers_json\": \"F\"}\n    merged_papers = {}\n\n    def add_or_update_paper(norm_t,\
          \ paper_info):\n        if norm_t not in merged_papers:\n            venues_set\
          \ = set()\n            if paper_info.get('venue'):\n                venues_set.add(paper_info['venue'])\n\
          \            paper_info['venues_set'] = venues_set\n            if 'citationCount'\
          \ not in paper_info: paper_info['citationCount'] = 0\n            merged_papers[norm_t]\
          \ = paper_info\n        else:\n            existing_paper = merged_papers[norm_t]\n\
          \            new_venue = paper_info.get('venue', '').strip()\n         \
          \   \n            # 【DBLP 权威盖章逻辑】\n            # 如果来源是 DBLP，或者新 venue 不是预印本，强制加入集合\n\
          \            if new_venue:\n                if paper_info.get('source')\
          \ == 'DBLP':\n                    existing_paper['venues_set'].add(f\"DBLP:\
          \ {new_venue}\") # 加个前缀，增加大模型识别度\n                elif 'arxiv' not in new_venue.lower()\
          \ and 'preprint' not in new_venue.lower():\n                    existing_paper['venues_set'].add(new_venue)\n\
          \            \n            if existing_paper['abstract'] in [\"暂缺\", \"\
          见原文链接\", \"\"] and paper_info.get('abstract'):\n                existing_paper['abstract']\
          \ = paper_info['abstract']\n                \n            new_citations\
          \ = paper_info.get('citationCount', 0)\n            if new_citations > existing_paper.get('citationCount',\
          \ 0):\n                existing_paper['citationCount'] = new_citations\n\
          \n    # ---------------------------------------------------------\n    #\
          \ 0. 解析 DBLP (最权威的 CS 期刊身份，最先解析打底)\n    # ---------------------------------------------------------\n\
          \    try:\n        if dblp_res:\n            dblp_data = json.loads(dblp_res)\n\
          \            hits = dblp_data.get('result', {}).get('hits', {}).get('hit',\
          \ [])\n            for item in hits:\n                info = item.get('info',\
          \ {})\n                title = info.get('title', '')\n                norm_t\
          \ = normalize_title(title)\n                if norm_t:\n               \
          \     # DBLP 作者可能是列表或单个字典\n                    raw_authors = info.get('authors',\
          \ {}).get('author', [])\n                    if isinstance(raw_authors,\
          \ dict): raw_authors = [raw_authors]\n                    authors = \",\
          \ \".join([a.get('text', '') for a in raw_authors if isinstance(a, dict)])\n\
          \                    \n                    venue = info.get('venue', '')\n\
          \                    # DBLP 偶尔也收录 CoRR (即 arXiv)，我们过滤掉它\n              \
          \      if venue and 'CoRR' not in venue:\n                        add_or_update_paper(norm_t,\
          \ {\n                            \"title\": title, \"year\": info.get('year',\
          \ '未知'), \"authors\": authors,\n                            \"url\": info.get('ee',\
          \ ''), \"abstract\": \"暂缺\",\n                            \"venue\": venue,\
          \ \"source\": \"DBLP\", \"citationCount\": 0\n                        })\n\
          \    except Exception as e: print(\"DBLP Err:\", e)\n\n\n    # ---------------------------------------------------------\n\
          \    # 1. 解析 Semantic Scholar (提供 citationCount)\n    # ---------------------------------------------------------\n\
          \    try:\n        if s2_res:\n            s2_data = json.loads(s2_res)\n\
          \            for item in s2_data.get('data', []):\n                title\
          \ = item.get('title', '')\n                norm_t = normalize_title(title)\n\
          \                if norm_t:\n                    authors = \", \".join([a.get('name',\
          \ '') for a in item.get('authors', [])])\n                    venue = item.get('venue',\
          \ '') or \"未知来源\"\n                    citations = item.get('citationCount',\
          \ 0)\n                    \n                    add_or_update_paper(norm_t,\
          \ {\n                        \"title\": title, \"year\": str(item.get('year',\
          \ '未知')), \"authors\": authors,\n                        \"url\": item.get('url',\
          \ ''), \"abstract\": item.get('abstract', '') or \"暂缺\",\n             \
          \           \"venue\": venue, \"source\": \"Semantic Scholar\", \"citationCount\"\
          : citations\n                    })\n    except Exception: pass\n\n    #\
          \ ---------------------------------------------------------\n    # 2. 解析\
          \ OpenAlex (提供 cited_by_count)\n    # ---------------------------------------------------------\n\
          \    try:\n        if oa_res:\n            oa_data = json.loads(oa_res)\n\
          \            for item in oa_data.get('results', []):\n                title\
          \ = item.get('title', '')\n                norm_t = normalize_title(title)\n\
          \                if norm_t:\n                    authors = \", \".join([a.get('author',\
          \ {}).get('display_name', '') for a in item.get('authorships', [])])\n \
          \                   primary_loc = item.get('primary_location') or {}\n \
          \                   source = primary_loc.get('source') or {}\n         \
          \           venue = source.get('display_name') or \"未知来源\"\n           \
          \         citations = item.get('cited_by_count', 0)\n                  \
          \  \n                    add_or_update_paper(norm_t, {\n               \
          \         \"title\": title, \"year\": str(item.get('publication_year', '未知')),\
          \ \"authors\": authors,\n                        \"url\": item.get('id',\
          \ ''), \"abstract\": \"见原文链接\",\n                        \"venue\": venue,\
          \ \"source\": \"OpenAlex\", \"citationCount\": citations\n             \
          \       })\n    except Exception: pass\n\n    # ---------------------------------------------------------\n\
          \    # 3. 解析 arXiv (底层仓库，无引用量)\n    # ---------------------------------------------------------\n\
          \    try:\n        if arxiv_res and \"http://www.w3.org/2005/Atom\" in arxiv_res:\n\
          \            root = ET.fromstring(arxiv_res)\n            ns = {'atom':\
          \ 'http://www.w3.org/2005/Atom', 'arxiv': 'http://arxiv.org/schemas/atom'}\n\
          \            for entry in root.findall('atom:entry', ns):\n            \
          \    title = entry.find('atom:title', ns).text\n                title =\
          \ title.replace('\\n', ' ').strip() if title else ''\n                norm_t\
          \ = normalize_title(title)\n                if norm_t:\n               \
          \     authors = \", \".join([a.find('atom:name', ns).text for a in entry.findall('atom:author',\
          \ ns)])\n                    url = entry.find('atom:id', ns).text\n    \
          \                year = entry.find('atom:published', ns).text[:4] if entry.find('atom:published',\
          \ ns) is not None else '未知'\n                    summary = entry.find('atom:summary',\
          \ ns)\n                    comment_node = entry.find('arxiv:comment', ns)\n\
          \                    comment = comment_node.text.lower() if comment_node\
          \ is not None else \"\"\n\n                    journal_ref = entry.find('arxiv:journal_ref',\
          \ ns)\n                    venue = journal_ref.text if journal_ref is not\
          \ None else \"arXiv Preprint\"\n                    venue = \"arXiv Preprint\"\
          \n                    # 如果作者在备注里写了 accepted 或者 to appear，我们直接把备注当成期刊名！\n\
          \                    if 'accept' in comment or 'appear' in comment:\n  \
          \                      venue = f\"Accepted/Appearing in: {comment_node.text}\"\
          \n\n                    add_or_update_paper(norm_t, {\n                \
          \        \"title\": title, \"year\": year, \"authors\": authors,\n     \
          \                   \"url\": url, \"abstract\": summary.text.replace('\\\
          n', ' ').strip() if summary is not None else '',\n                     \
          \   \"venue\": venue, \"source\": \"arXiv\", \"citationCount\": 0\n    \
          \                })\n    except Exception: pass\n\n    # 简单过滤空数据，并压缩体积（截断过长摘要以节省\
          \ Token）\n    candidate_pool = []\n    # 最多保留前Rank_1_limit篇喂给大模\n    for\
          \ p in list(merged_papers.values())[:Rank_1_limit]: \n        venues_list\
          \ = list(p.pop('venues_set', set()))\n        display_venue = \" / \".join(venues_list)\
          \ if venues_list else \"arXiv Preprint\"\n        \n        abstract = p.get('abstract',\
          \ '')\n        # 截断摘要到 800 字符，足够大模型判断语义相关性了\n        short_abstract = abstract[:800]\
          \ + \"...\" if len(abstract) > 800 else abstract\n\n        candidate_pool.append({\n\
          \            \"title\": p.get('title', ''),\n            \"authors\": p.get('authors',\
          \ ''),\n            \"year\": p.get('year', '未知'),\n            \"venue\"\
          : display_venue,\n            \"citations\": p.get('citationCount', 0),\n\
          \            \"abstract\": short_abstract,\n            \"url\": p.get('url',\
          \ '')\n        })\n\n    # 将这Rank_1_limit篇论文转化为一个纯文本的 JSON 字符串\n    return\
          \ {\n        \"all_papers_json_str\": json.dumps(candidate_pool, ensure_ascii=False)\n\
          \    }"
        code_language: python3
        outputs:
          all_papers_json_str:
            children: null
            type: string
