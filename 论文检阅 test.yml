    - data:
        code: "def main(target_id: str, saved_papers: str) -> dict:\n    import json\n\
          \    try:\n        papers = json.loads(saved_papers)\n        target_paper\
          \ = None\n        target_id = str(target_id).strip()\n        \n       \
          \ # 1. 智能匹配：不光比对 paperId，也支持比对 url\n        if isinstance(papers, list):\n\
          \            for p in papers:\n                if not isinstance(p, dict):\n\
          \                    continue\n                p_id = str(p.get(\"paperId\"\
          , \"\")).strip()\n                p_url = str(p.get(\"url\", \"\")).strip()\n\
          \                \n                # 如果 target_id 和 paperId 匹配，或者 target_id\
          \ 是这篇论文的 URL，都算命中！\n                if (p_id and p_id == target_id) or (p_url\
          \ and target_id in p_url):\n                    target_paper = p\n     \
          \               break\n        \n        # 2. 如果还是找不到，为了防止 Zotero 报错崩溃，返回空数组\n\
          \        if not target_paper:\n            return {\"zotero_payload\": \"\
          []\"}\n            \n        # 3. 智能解析作者格式\n        raw_authors = target_paper.get(\"\
          authors\", \"\")\n        creators = []\n        if isinstance(raw_authors,\
          \ str):\n            names = [n.strip() for n in raw_authors.split(\",\"\
          ) if n.strip()]\n            for name in names:\n                creators.append({\"\
          creatorType\": \"author\", \"name\": name})\n        elif isinstance(raw_authors,\
          \ list):\n            for item in raw_authors:\n                if isinstance(item,\
          \ str):\n                    creators.append({\"creatorType\": \"author\"\
          , \"name\": item})\n                elif isinstance(item, dict):\n     \
          \               creators.append({\"creatorType\": \"author\", \"name\":\
          \ item.get(\"name\", \"Unknown\")})\n        \n        # 4. 【核心修复】：Zotero\
          \ 严格要求最外层必须是 JSON Array (中括号 [...])\n        zotero_item_array = [{\n  \
          \          \"itemType\": \"journalArticle\",\n            \"title\": target_paper.get(\"\
          title\", \"Unknown Title\"),\n            \"creators\": creators,\n    \
          \        \"url\": target_paper.get(\"url\", \"\"),\n            \"date\"\
          : str(target_paper.get(\"year\", \"\"))\n        }]\n        \n        return\
          \ {\"zotero_payload\": json.dumps(zotero_item_array)}\n        \n    except\
          \ Exception as e:\n        # 发生任何异常，都返回空数组保平安\n        return {\"zotero_payload\"\
          : \"[]\"}"
