          \ JSON\n        match = re.search(r'\\{.*\\}', json_text, re.DOTALL)\n \
          \       if match:\n            clean_str = match.group(0)\n        else:\n\
          \            # 备选方案：原有的清理逻辑\n            clean_str = json_text.replace(\"\
          ```json\", \"\").replace(\"```\", \"\").strip()\n        \n        # 3.\
          \ 解析 JSON\n        data = json.loads(clean_str)\n        \n        intent\
          \ = data.get(\"intent\", \"\")\n        source_value = str(data.get(\"source_value\"\
          , \"\"))\n        \n        # 4. 保留你原有的 ArXiv 特殊处理逻辑\n        if \"arxiv.org\"\
          \ in source_value:\n            # A. 如果是 PDF 链接，修正为网页版链接 (abs)\n       \
          \     if \"/pdf/\" in source_value:\n                source_value = source_value.replace(\"\
          /pdf/\", \"/abs/\")\n            if source_value.endswith(\".pdf\"):\n \
          \               source_value = source_value[:-4]\n            \n       \
          \     # B. 如果意图是“深度解析(read)”，开启 ar5iv 模式\n            if intent == \"read\"\
          :\n                source_value = source_value.replace(\"arxiv.org\", \"\
          ar5iv.org\")\n\n        # 5. 提取参数\n        try:\n            final_limit\
          \ = int(data.get(\"limit\", 3))\n        except:\n            final_limit\
          \ = 3\n\n        return {\n            \"pure_value\": source_value,\n \
          \           \"year\": str(data.get(\"year\", \"\")),\n            \"limit\"\
          : final_limit\n        }\n        \n    except Exception as e:\n       \
          \ # 如果解析彻底失败，尝试返回一个极简结构防止下游节点崩溃\n        return {\n            \"pure_value\"\
          : \"ERROR_PARSING\",\n            \"year\": \"\",\n            \"limit\"\
          : 3\n        }"
